[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevlab"
version = "0.1.0"
description = "Jev (TypeSafe System One) x SAM 3.1 実験場: 30 の Jev ユースケース実装 + CV x Jev のフラッグシップ SceneJudge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
sdk = ["typesafe-sdk>=0.7"]
sam = ["meta-sam-parser>=0.0.5", "pillow>=10"]
browser = ["playwright>=1.45"]
mcp = []
pg = ["psycopg[binary]>=3.1"]
search = ["requests>=2.31"]
graph = ["neo4j>=5"]
voice = ["SpeechRecognition>=3.10"]
discord = ["discord.py>=2.3"]
llm = ["anthropic>=1.6"]
local = ["torch>=2.2", "transformers>=4.44", "numpy>=1.24"]
drone = ["mujoco>=3.1", "numpy>=1.24"]
all = ["jevlab[dev,sdk,sam,browser,pg,search,graph,voice,discord,llm]"]

[project.scripts]
jevlab = "jevlab.cli:main"

[tool.setuptools.packages.find]
include = ["jevlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instant Quote</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15202b; --muted:#5b6672; --accent:#0b6e4f; --line:#e3e7eb; --warn:#8a5a00; --warnbg:#fff4d6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1418; --card:#171e24; --ink:#e8edf2; --muted:#9aa7b3; --accent:#3ccf94; --line:#2a343d; --warn:#ffd27a; --warnbg:#3a2e10; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 20px 16px; border-bottom: 1px solid var(--line); background: var(--card); }
  header h1 { margin:0; font-size: 20px; }
  header p { margin: 4px 0 0; color: var(--muted); }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .banner { background: var(--warnbg); color: var(--warn); padding: 10px 12px; border-radius: 8px; font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 20px; }
  label { display:block; font-weight:600; margin-bottom: 8px; }
  textarea, input { width:100%; font: inherit; color: inherit; background: transparent; border:1px solid var(--line); border-radius: 8px; padding: 12px; }
  textarea { min-height: 96px; resize: vertical; }
  button { margin-top: 12px; font: inherit; font-weight: 600; color:#fff; background: var(--accent); border:0; border-radius: 8px; padding: 12px 18px; cursor:pointer; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  #result { margin-top: 20px; }
  .range { font-size: 32px; font-weight: 700; }
  .meta { color: var(--muted); font-size: 14px; }
  .hidden { display:none; }
  footer { margin-top: 32px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 id="biz">…</h1>
  <p id="tagline"></p>
</header>
<main>
  <div id="sample" class="banner hidden">Sample pricing: the price table has not been built from real contractor pages yet.</div>
  <div class="card">
    <form id="ask">
      <label for="text" id="prompt">Tell us what's wrong</label>
      <textarea id="text" name="text" required placeholder="e.g. my ac is blowing warm air and it's 110 out"></textarea>
      <button type="submit" id="go">Get a price</button>
    </form>
    <form id="followup" class="hidden">
      <label for="answer" id="followupQ"></label>
      <input id="answer" name="answer" inputmode="numeric" required>
      <button type="submit">Continue</button>
    </form>
    <div id="result"></div>
  </div>
  <footer>Ranges come from a public price table for this trade in this area. Final price confirmed before any work starts.</footer>
</main>
<script>
const $ = (id) => document.getElementById(id);
let cfg = {};
let pendingId = null;
const money = (n) => '$' + Number(n).toLocaleString('en-US');

async function load() {
  cfg = await (await fetch('/api/config')).json();
  $('biz').textContent = cfg.business.name;
  $('tagline').textContent = cfg.business.tagline || '';
  document.title = cfg.business.name + ' · Instant Quote';
  $('prompt').textContent = cfg.profile === 'b2b' ? 'Tell us what you need' : "Tell us what's wrong";
  $('text').placeholder = cfg.profile === 'b2b' ? 'e.g. 40 double-sided yard signs with stakes by Friday' : "e.g. my ac is blowing warm air and it's 110 out";
  if (cfg.status !== 'live') $('sample').classList.remove('hidden');
}

function render(r) {
  const out = $('result');
  $('followup').classList.add('hidden');
  if (r.kind === 'range') {
    const what = r.service || r.label || '';
    const detail = r.size ? `${r.size} job · ${r.urgency.replace('_', ' ')}` : (r.band ? `${r.band} quantity${r.note ? ' · ' + r.note : ''}` : '');
    out.innerHTML = `<div class="range">${money(r.low)} – ${money(r.high)}</div>
      <div class="meta">${what}${detail ? ' · ' + detail : ''} · answered in ${Math.round(r.ms)} ms</div>
      <p>We'll text you to confirm. Nothing is booked yet.</p>`;
  } else if (r.kind === 'visit' || r.kind === 'call') {
    out.innerHTML = `<p><strong>We'll confirm within the hour.</strong> This one needs a closer look before we can put a number on it.</p>
      <a href="${cfg.business.bookingUrl}"><button class="secondary" type="button">${r.kind === 'visit' ? 'Book a visit' : 'Book a call'}</button></a>`;
  } else if (r.kind === 'ask') {
    pendingId = r.pendingId;
    $('followupQ').textContent = r.question;
    $('answer').value = '';
    $('followup').classList.remove('hidden');
    out.innerHTML = '';
    $('answer').focus();
  } else if (r.kind === 'ignore') {
    out.innerHTML = `<p>Thanks. If you need a hand with something, tell us a bit more about the job.</p>`;
  } else if (r.kind === 'error') {
    out.innerHTML = `<p><strong>We couldn't get a price right now.</strong> Call ${cfg.business.phone} or <a href="${cfg.business.bookingUrl}">book a visit</a>.</p><p class="meta">${r.message || ''}</p>`;
  } else {
    out.innerHTML = `<p>Please try again.</p>`;
  }
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}

$('ask').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('go').disabled = true;
  $('result').innerHTML = '<p class="meta">Checking…</p>';
  try { render(await post('/api/quote', { text: $('text').value })); }
  catch (err) { render({ kind: 'error', message: String(err) }); }
  finally { $('go').disabled = false; }
});
$('followup').addEventListener('submit', async (e) => {
  e.preventDefault();
  try { render(await post('/api/answer', { pendingId, value: $('answer').value })); }
  catch (err) { render({ kind: 'error', message: String(err) }); }
});
load();
</script>
</body>
</html>
